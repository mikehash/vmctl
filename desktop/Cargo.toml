# vmctl-desktop is its own workspace: Slint's dependency tree conflicts with
# ratatui's pinned unicode-width used by the TUI. Both share vmctl-core by path.
[workspace]
resolver = "2"
members = ["."]

[package]
name = "vmctl-desktop"
version = "0.2.0"
edition = "2021"
description = "Mission Control — the Slint desktop front-end for vm-bhyve over vmctl-core"
license = "BSD-2-Clause"

[[bin]]
name = "vmctl-desktop"
path = "src/main.rs"

[dependencies]
vmctl-core = { path = "../core" }
# Pure-Rust stack: winit windowing + femtovg (OpenGL) renderer, with the
# software renderer as a fallback for hosts without GL (e.g. Xvfb, VNC).
slint = { version = "1.18", default-features = false, features = ["std", "compat-1-2", "backend-winit", "renderer-femtovg", "renderer-software", "accessibility"] }
png = "0.18"

[build-dependencies]
slint-build = "1.18"

[dev-dependencies]
i-slint-backend-testing = "1.18"

[profile.release]
lto = "thin"
codegen-units = 4
strip = true
