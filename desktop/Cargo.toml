# vmctl-desktop is built as its own workspace: Slint's dependency tree
# (annotate-snippets → unicode-width ^0.2.2) conflicts with ratatui's pinned
# unicode-width =0.2.0 used by the TUI. Keeping the front-ends in separate
# workspaces lets each resolve its own deps while still sharing vmctl-core.
[workspace]
resolver = "2"
members = ["."]

[workspace.package]
version = "0.1.0"
edition = "2021"

[package]
name = "vmctl-desktop"
version = "0.1.0"
edition = "2021"
description = "Mission Control — the Slint desktop front-end for vm-bhyve over vmctl-core"

[[bin]]
name = "vmctl-desktop"
path = "src/main.rs"

[dependencies]
vmctl-core = { path = "../core" }
slint = "1.18"
anyhow = "1"

[build-dependencies]
slint-build = "1.18"

[dev-dependencies]
tempfile = "3"
